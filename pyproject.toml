[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-spawn"
version = "1.0.0"
description = "Modern systemd-nspawn container orchestration system"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "Thiago Camargo", email = "thiagocmc@proton.me"},
]
keywords = ["systemd", "nspawn", "containers", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

# Runtime API floors are constrained by supported Debian/Ubuntu archive
# packages. Do not raise these for APIs unavailable on Ubuntu 24.04,
# Ubuntu 26.04, or Debian 13. python-systemd and aiofiles were removed as
# unused-dependency cleanup: src/ and tests/ do not import them.
dependencies = [
    "pydantic>=1.10.14,<3",
    "typer>=0.9.0",
    "rich>=13.7.1",
    "dbus-next>=0.2.3",
    "ruamel.yaml>=0.17.21",
    "jinja2>=3.1.2",
    "watchfiles>=0.21.0",
    "httpx>=0.26.0",
    "aiohttp>=3.9.1",
    "websockets>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.20.3",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
chimeractl = "chimera.cli.main:main"
chimera-server = "chimera.server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/chimera/cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "privileged: requires an explicitly designated disposable systemd/nspawn testbed",
]
